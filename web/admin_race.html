<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏁 Race Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            color: #e5e7eb;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 16px;
            color: #10b981;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #9ca3af;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #e5e7eb;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 8px;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button.danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-waiting { background: #6b7280; }
        .status-active { background: #10b981; }
        .status-finished { background: #3b82f6; }
        .status-crashed { background: #ef4444; }
        .status-racing { background: #f59e0b; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }

        .stat-box {
            text-align: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #10b981;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-top: 4px;
        }

        .leaderboard {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        .leaderboard-header {
            background: rgba(16, 185, 129, 0.1);
            padding: 16px;
            font-weight: 600;
            display: grid;
            grid-template-columns: 60px 1fr 100px 120px 120px;
            gap: 16px;
        }

        .leaderboard-row {
            padding: 12px 16px;
            display: grid;
            grid-template-columns: 60px 1fr 100px 120px 120px;
            gap: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center;
        }

        .leaderboard-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .rank {
            font-size: 1.5rem;
            font-weight: bold;
            color: #10b981;
        }

        .rank-1 { color: #fbbf24; }
        .rank-2 { color: #9ca3af; }
        .rank-3 { color: #cd7f32; }

        #race-status {
            font-size: 1.2rem;
            padding: 12px;
            background: rgba(107, 114, 128, 0.2);
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏁 Race Admin Panel</h1>

        <div id="race-status">No active race</div>

        <div class="controls">
            <!-- Create Race -->
            <div class="card">
                <h2>Create Race</h2>
                <div class="form-group">
                    <label>Race Name</label>
                    <input type="text" id="race-name" value="Campus Sprint">
                </div>
                <div class="form-group">
                    <label>Destination</label>
                    <select id="destination">
                        <option value="north">North Campus (43.078, -89.401)</option>
                        <option value="south">South Campus (43.068, -89.401)</option>
                        <option value="east">East Campus (43.073, -89.396)</option>
                        <option value="west">West Campus (43.073, -89.406)</option>
                    </select>
                </div>
                <button id="create-btn">Create Race</button>
            </div>

            <!-- Race Controls -->
            <div class="card">
                <h2>Race Controls</h2>
                <button id="start-btn" class="hidden">Start Race 🚦</button>
                <button id="end-btn" class="hidden danger">End Race</button>
                <div id="race-info" class="hidden" style="margin-top: 16px;">
                    <p style="color: #9ca3af;">Race ID: <span id="current-race-id">-</span></p>
                </div>
            </div>

            <!-- Live Stats -->
            <div class="card">
                <h2>Live Stats</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-value" id="stat-total">0</div>
                        <div class="stat-label">Total</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="stat-racing">0</div>
                        <div class="stat-label">Racing</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="stat-finished">0</div>
                        <div class="stat-label">Finished</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="stat-crashed">0</div>
                        <div class="stat-label">Crashed</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Leaderboard -->
        <div class="card">
            <h2>🏆 Leaderboard</h2>
            <div class="leaderboard">
                <div class="leaderboard-header">
                    <div>Rank</div>
                    <div>Player</div>
                    <div>Status</div>
                    <div>Time</div>
                    <div>Distance</div>
                </div>
                <div id="leaderboard-body">
                    <div style="padding: 40px; text-align: center; color: #6b7280;">
                        No players yet
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v2/race';
        let currentRaceId = null;
        let updateInterval = null;

        const destinations = {
            north: { name: 'North Campus', lat: 43.078, lon: -89.401 },
            south: { name: 'South Campus', lat: 43.068, lon: -89.401 },
            east: { name: 'East Campus', lat: 43.073, lon: -89.396 },
            west: { name: 'West Campus', lat: 43.073, lon: -89.406 }
        };

        // Create Race
        document.getElementById('create-btn').addEventListener('click', async () => {
            const raceName = document.getElementById('race-name').value;
            const destKey = document.getElementById('destination').value;
            const dest = destinations[destKey];

            const raceId = `race_${Date.now()}`;

            try {
                const response = await fetch(`${API_BASE}/admin/race/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        race_id: raceId,
                        name: raceName,
                        destination_name: dest.name,
                        destination_lat: dest.lat,
                        destination_lon: dest.lon,
                        destination_radius: 20
                    })
                });

                if (response.ok) {
                    currentRaceId = raceId;
                    document.getElementById('current-race-id').textContent = raceId;
                    document.getElementById('race-status').textContent = `Race Created: ${raceName}`;
                    document.getElementById('start-btn').classList.remove('hidden');
                    document.getElementById('race-info').classList.remove('hidden');
                    document.getElementById('create-btn').disabled = true;
                    
                    startLiveUpdates();
                }
            } catch (error) {
                alert('Error creating race: ' + error.message);
            }
        });

        // Start Race
        document.getElementById('start-btn').addEventListener('click', async () => {
            if (!currentRaceId) return;

            try {
                const response = await fetch(`${API_BASE}/admin/race/${currentRaceId}/start`, {
                    method: 'POST'
                });

                if (response.ok) {
                    document.getElementById('race-status').textContent = '🏁 RACE IN PROGRESS';
                    document.getElementById('race-status').style.background = 'rgba(16, 185, 129, 0.2)';
                    document.getElementById('start-btn').classList.add('hidden');
                    document.getElementById('end-btn').classList.remove('hidden');
                }
            } catch (error) {
                alert('Error starting race: ' + error.message);
            }
        });

        // End Race
        document.getElementById('end-btn').addEventListener('click', async () => {
            if (!currentRaceId) return;
            if (!confirm('End the race?')) return;

            try {
                const response = await fetch(`${API_BASE}/admin/race/${currentRaceId}/end`, {
                    method: 'POST'
                });

                if (response.ok) {
                    document.getElementById('race-status').textContent = '✅ RACE FINISHED';
                    document.getElementById('race-status').style.background = 'rgba(59, 130, 246, 0.2)';
                    document.getElementById('end-btn').classList.add('hidden');
                    
                    if (updateInterval) {
                        clearInterval(updateInterval);
                    }
                }
            } catch (error) {
                alert('Error ending race: ' + error.message);
            }
        });

        // Update race status
        async function updateRaceStatus() {
            if (!currentRaceId) return;

            try {
                const response = await fetch(`${API_BASE}/admin/race/${currentRaceId}/status`);
                if (!response.ok) return;

                const data = await response.json();

                // Update stats
                document.getElementById('stat-total').textContent = data.players.total;
                document.getElementById('stat-racing').textContent = data.players.racing;
                document.getElementById('stat-finished').textContent = data.players.finished;
                document.getElementById('stat-crashed').textContent = data.players.crashed;

                // Update leaderboard
                updateLeaderboard(data.leaderboard);

            } catch (error) {
                console.error('Update error:', error);
            }
        }

        function updateLeaderboard(leaderboard) {
            const body = document.getElementById('leaderboard-body');
            
            if (leaderboard.length === 0) {
                body.innerHTML = '<div style="padding: 40px; text-align: center; color: #6b7280;">No players yet</div>';
                return;
            }

            body.innerHTML = leaderboard.map(player => {
                const rankClass = player.rank ? `rank-${player.rank}` : '';
                const rankDisplay = player.rank || '-';
                const statusClass = `status-${player.status}`;
                
                let timeDisplay = '-';
                if (player.time !== null && player.time !== undefined) {
                    timeDisplay = `${player.time.toFixed(2)}s`;
                }
                
                let distanceDisplay = '-';
                if (player.distance) {
                    distanceDisplay = `${player.distance.toFixed(0)}m`;
                }
                if (player.distance_to_finish) {
                    distanceDisplay += ` (${player.distance_to_finish.toFixed(0)}m left)`;
                }

                return `
                    <div class="leaderboard-row">
                        <div class="rank ${rankClass}">${rankDisplay}</div>
                        <div>${player.username}</div>
                        <div><span class="status-badge ${statusClass}">${player.status}</span></div>
                        <div>${timeDisplay}</div>
                        <div>${distanceDisplay}</div>
                    </div>
                `;
            }).join('');
        }

        function startLiveUpdates() {
            updateRaceStatus(); // Immediate update
            updateInterval = setInterval(updateRaceStatus, 1000); // Update every second
        }

        // Check for active race on load
        (async () => {
            try {
                const response = await fetch(`${API_BASE}/admin/race/active`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.active_race) {
                        currentRaceId = data.active_race.race_id;
                        document.getElementById('current-race-id').textContent = currentRaceId;
                        document.getElementById('race-info').classList.remove('hidden');
                        document.getElementById('create-btn').disabled = true;
                        
                        if (data.active_race.status === 'active') {
                            document.getElementById('race-status').textContent = '🏁 RACE IN PROGRESS';
                            document.getElementById('race-status').style.background = 'rgba(16, 185, 129, 0.2)';
                            document.getElementById('end-btn').classList.remove('hidden');
                            startLiveUpdates();
                        } else {
                            document.getElementById('start-btn').classList.remove('hidden');
                            startLiveUpdates();
                        }
                    }
                }
            } catch (error) {
                console.error('Failed to check for active race:', error);
            }
        })();
    </script>
</body>
</html>
