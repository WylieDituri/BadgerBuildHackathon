<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏁 Race Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            color: #e5e7eb;
            overflow: hidden;
        }

        #lobby {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        #racing-view {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        .lobby-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #9ca3af;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e5e7eb;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        #map-view {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
        }

        #hud {
            padding: 20px;
            background: rgba(15, 20, 25, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hud-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }

        .hud-item {
            text-align: center;
        }

        .hud-label {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .hud-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #10b981;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            image-rendering: crisp-edges;
        }

        .status-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px 60px;
            border-radius: 16px;
            text-align: center;
            z-index: 1000;
        }

        .status-message h2 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .status-message.crashed {
            border: 3px solid #ef4444;
        }

        .status-message.crashed h2 {
            color: #ef4444;
        }

        .status-message.finished {
            border: 3px solid #10b981;
        }

        .status-message.finished h2 {
            color: #10b981;
        }

        .stat-row {
            margin: 10px 0;
            font-size: 1.2rem;
        }

        .controls-hint {
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <!-- Lobby -->
    <div id="lobby">
        <div class="lobby-card">
            <h1>🏁 Join Race</h1>
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="username" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Starting Point</label>
                <select id="start-point">
                    <option value="north">North Campus</option>
                    <option value="south">South Campus</option>
                    <option value="east">East Campus</option>
                    <option value="west">West Campus</option>
                </select>
            </div>
            <button id="join-btn">Join Race</button>
            <div class="controls-hint">
                Use Arrow Keys to drive<br>
                🔼 Forward | 🔽 Reverse | ◀️ Left | ▶️ Right
            </div>
        </div>
    </div>

    <!-- Racing View -->
    <div id="racing-view">
        <div id="map-view">
            <canvas id="game-canvas"></canvas>
        </div>
        <div id="hud">
            <div class="hud-grid">
                <div class="hud-item">
                    <div class="hud-label">Speed</div>
                    <div class="hud-value" id="hud-speed">0</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">Time</div>
                    <div class="hud-value" id="hud-time">0.0s</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">Distance to Finish</div>
                    <div class="hud-value" id="hud-distance">-</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">Status</div>
                    <div class="hud-value" id="hud-status">Waiting</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v2/race';
        const INTEL_API = 'http://localhost:8000/api/v2/intelligence';
        
        let playerId = null;
        let carId = null;
        let raceId = null;
        let currentLat = 0;
        let currentLon = 0;
        let heading = 0;
        let speed = 0; // mph
        let startTime = null;
        let gameLoopInterval = null;
        let updateInterval = null;

        const startPoints = {
            north: { name: 'North Campus', lat: 43.078, lon: -89.401 },
            south: { name: 'South Campus', lat: 43.068, lon: -89.401 },
            east: { name: 'East Campus', lat: 43.073, lon: -89.396 },
            west: { name: 'West Campus', lat: 43.073, lon: -89.406 }
        };

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        let destinationLat = 0;
        let destinationLon = 0;

        // Join race
        document.getElementById('join-btn').addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const startKey = document.getElementById('start-point').value;

            if (!username) {
                alert('Please enter your name');
                return;
            }

            const startPoint = startPoints[startKey];
            playerId = `player_${username}_${Date.now()}`;
            currentLat = startPoint.lat;
            currentLon = startPoint.lon;

            try {
                // Get active race
                const raceResponse = await fetch(`${API_BASE}/admin/race/active`);
                const raceData = await raceResponse.json();

                if (!raceData.active_race) {
                    alert('No active race. Please wait for admin to create one.');
                    return;
                }

                raceId = raceData.active_race.race_id;

                // Register for race
                const registerResponse = await fetch(`${API_BASE}/player/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        race_id: raceId,
                        player_id: playerId,
                        username: username,
                        start_point_name: startPoint.name,
                        start_lat: startPoint.lat,
                        start_lon: startPoint.lon
                    })
                });

                if (!registerResponse.ok) {
                    alert('Failed to join race. It may be full or already started.');
                    return;
                }

                const registerData = await registerResponse.json();
                carId = registerData.car_id;

                // Register car with intelligence system
                await fetch(`${INTEL_API}/cars/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        car_id: carId,
                        vehicle_type: 'sedan',
                        owner_id: username,
                        is_emergency: false
                    })
                });

                // Get race info
                const infoResponse = await fetch(`${API_BASE}/player/${playerId}/race`);
                const raceInfo = await infoResponse.json();
                
                destinationLat = raceInfo.destination.lat;
                destinationLon = raceInfo.destination.lon;

                // Switch to racing view
                document.getElementById('lobby').style.display = 'none';
                document.getElementById('racing-view').style.display = 'flex';
                
                resizeCanvas();
                startGame();

            } catch (error) {
                alert('Error joining race: ' + error.message);
            }
        });

        function resizeCanvas() {
            const container = document.getElementById('map-view');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);

        // Game controls
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function updateControls() {
            if (keys['ArrowUp']) {
                speed = Math.min(speed + 2, 60);
            } else if (keys['ArrowDown']) {
                speed = Math.max(speed - 2, 0);
            } else {
                speed = Math.max(speed - 1, 0);
            }

            if (keys['ArrowLeft']) {
                heading = (heading - 5 + 360) % 360;
            }
            if (keys['ArrowRight']) {
                heading = (heading + 5) % 360;
            }

            // Update position based on heading and speed
            const speedMps = speed * 0.44704; // mph to m/s
            const deltaLat = (speedMps * Math.cos(heading * Math.PI / 180) / 111000) / 30;
            const deltaLon = (speedMps * Math.sin(heading * Math.PI / 180) / 111000) / 30;
            
            currentLat += deltaLat;
            currentLon += deltaLon;
        }

        async function sendUpdate() {
            if (!playerId || !carId) return;

            try {
                const speedMps = speed * 0.44704;
                
                // Update race position
                const raceResponse = await fetch(`${API_BASE}/player/position`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        player_id: playerId,
                        lat: currentLat,
                        lon: currentLon,
                        speed_mps: speedMps
                    })
                });

                if (raceResponse.ok) {
                    const result = await raceResponse.json();
                    
                    if (result.event === 'finished') {
                        showFinishMessage(result);
                        stopGame();
                    } else if (result.event === 'crashed') {
                        showCrashMessage(result);
                        stopGame();
                    }
                }

                // Update intelligence system
                await fetch(`${INTEL_API}/cars/location`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        car_id: carId,
                        lat: currentLat,
                        lon: currentLon,
                        heading: heading,
                        speed_mps: speedMps
                    })
                });

                // Update HUD
                updateHUD();

            } catch (error) {
                console.error('Update error:', error);
            }
        }

        async function updateHUD() {
            try {
                const response = await fetch(`${API_BASE}/player/${playerId}/stats`);
                if (!response.ok) return;

                const stats = await response.json();

                document.getElementById('hud-speed').textContent = `${Math.round(speed)} mph`;
                document.getElementById('hud-status').textContent = stats.status;

                if (stats.current_time) {
                    document.getElementById('hud-time').textContent = `${stats.current_time.toFixed(1)}s`;
                }

                if (stats.distance_to_finish) {
                    document.getElementById('hud-distance').textContent = `${Math.round(stats.distance_to_finish)}m`;
                }

            } catch (error) {
                console.error('HUD update error:', error);
            }
        }

        function draw() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw view centered on player
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Draw destination indicator
            const destAngle = Math.atan2(
                destinationLon - currentLon,
                destinationLat - currentLat
            );
            const destDistance = Math.sqrt(
                Math.pow((destinationLat - currentLat) * 111000, 2) +
                Math.pow((destinationLon - currentLon) * 111000, 2)
            );

            // Draw arrow pointing to destination
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(destAngle);
            
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, -60);
            ctx.lineTo(20, -40);
            ctx.moveTo(0, -60);
            ctx.lineTo(-20, -40);
            ctx.stroke();
            
            ctx.fillStyle = '#10b981';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`${Math.round(destDistance)}m`, 0, -20);
            
            ctx.restore();

            // Draw player car
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(heading * Math.PI / 180);
            
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(-15, -25, 30, 50);
            ctx.fillStyle = '#60a5fa';
            ctx.fillRect(-10, -20, 20, 15);
            
            ctx.restore();

            // Draw mini compass
            ctx.save();
            ctx.translate(50, 50);
            ctx.strokeStyle = '#6b7280';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 30, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.rotate(heading * Math.PI / 180);
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(5, -10);
            ctx.lineTo(-5, -10);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }

        function gameLoop() {
            updateControls();
            draw();
        }

        function startGame() {
            startTime = Date.now();
            gameLoopInterval = setInterval(gameLoop, 1000 / 30); // 30 FPS
            updateInterval = setInterval(sendUpdate, 100); // 10 updates/sec
        }

        function stopGame() {
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            if (updateInterval) clearInterval(updateInterval);
        }

        function showFinishMessage(result) {
            const msg = document.createElement('div');
            msg.className = 'status-message finished';
            msg.innerHTML = `
                <h2>🏁 FINISHED!</h2>
                <div class="stat-row">Time: <strong>${result.time.toFixed(2)}s</strong></div>
                <div class="stat-row">Rank: <strong>#${result.rank}</strong></div>
            `;
            document.getElementById('map-view').appendChild(msg);
        }

        function showCrashMessage(result) {
            const msg = document.createElement('div');
            msg.className = 'status-message crashed';
            msg.innerHTML = `
                <h2>💥 CRASHED!</h2>
                <div class="stat-row">Time: ${result.time.toFixed(2)}s</div>
                <div class="stat-row">You're out of the race</div>
            `;
            document.getElementById('map-view').appendChild(msg);
        }
    </script>
</body>
</html>
